version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
# CarMarket – Local Development Stack
#
# Each service builds from its OWN folder — fully independent.
#
# Build ONE service:      docker compose build car-service
# Rebuild & restart ONE:  docker compose up -d --build --no-deps car-service
# Start all:              docker compose up -d
# Stop all:               docker compose down
# Wipe all data:          docker compose down -v
# ─────────────────────────────────────────────────────────────────────────────

networks:
  carmarket-net:
    driver: bridge

volumes:
  postgres-auth-data:
  postgres-user-data:
  postgres-car-data:
  redis-data:
  kafka-data:
  zookeeper-data:
  elasticsearch-data:
  postgres-chat-data:
  postgres-auction-data:

services:

  # ─── INFRASTRUCTURE ─────────────────────────────────────────────────────────
  # These never need rebuilding — they are third-party images.
  # docker compose up -d postgres-auth redis kafka elasticsearch

  postgres-auth:
    image: postgres:16-alpine
    container_name: postgres-auth
    networks: [carmarket-net]
    ports: ["5433:5432"]
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-user:
    image: postgres:16-alpine
    container_name: postgres-user
    networks: [carmarket-net]
    ports: ["5434:5432"]
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-car:
    image: postgres:16-alpine
    container_name: postgres-car
    networks: [carmarket-net]
    ports: ["5435:5432"]
    environment:
      POSTGRES_DB: car_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-car-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d car_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    networks: [carmarket-net]
    ports: ["6379:6379"]
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    networks: [carmarket-net]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    networks: [carmarket-net]
    ports: ["9092:9092"]
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    networks: [carmarket-net]
    ports: ["9080:8080"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: carmarket
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    networks: [carmarket-net]
    ports: ["9200:9200"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana
    networks: [carmarket-net]
    ports: ["5601:5601"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200

  # ─── SERVICE DISCOVERY ──────────────────────────────────────────────────────
  # Rebuild: docker compose build eureka-server
  # Restart: docker compose up -d --no-deps eureka-server

  eureka-server:
    build:
      context: ./eureka-server    # ← builds ONLY from eureka-server/
      dockerfile: Dockerfile
    image: carmarket/eureka-server:local
    container_name: eureka-server
    networks: [carmarket-net]
    ports: ["8761:8761"]
    environment:
      EUREKA_USER: ${EUREKA_USER:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-admin}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://admin:admin@localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ─── API GATEWAY ────────────────────────────────────────────────────────────
  # Rebuild: docker compose build api-gateway
  # Restart: docker compose up -d --build --no-deps api-gateway

  api-gateway:
    build:
      context: ./api-gateway      # ← builds ONLY from api-gateway/
      dockerfile: Dockerfile
    image: carmarket/api-gateway:local
    container_name: api-gateway
    networks: [carmarket-net]
    ports: ["8080:8080"]
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      EUREKA_HOST: eureka-server
      EUREKA_USER: ${EUREKA_USER:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-admin}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-bXlTdXBlclNlY3JldEtleUZvckNhck1hcmtldEp3dFRva2VuMjAyNA==}  #  -bXlTdXBlclNlY3JldEtleUZvckNhck1hcmtldEp3dFRva2VuMjAyNA==}
    restart: on-failure

  # ─── AUTH SERVICE ────────────────────────────────────────────────────────────
  # Rebuild: docker compose build auth-service
  # Restart: docker compose up -d --build --no-deps auth-service

  auth-service:
    build:
      context: ./auth-service     # ← builds ONLY from auth-service/
      dockerfile: Dockerfile
    image: carmarket/auth-service:local
    container_name: auth-service
    networks: [carmarket-net]
    ports: ["8081:8081"]
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres-auth:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      EUREKA_HOST: eureka-server
      EUREKA_USER: ${EUREKA_USER:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-admin}
      DB_HOST: postgres-auth
      DB_NAME: auth_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-bXlTdXBlclNlY3JldEtleUZvckNhck1hcmtldEp3dFRva2VuMjAyNA==}  #-bXlTdXBlclNlY3JldEtleUZvckNhck1hcmtldEp3dFRva2VuMjAyNA==}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      OAUTH2_REDIRECT_URI: ${OAUTH2_REDIRECT_URI:-http://localhost:3000/auth/callback}
      OAUTH2_ALLOWED_HOSTS: ${OAUTH2_ALLOWED_HOSTS:-localhost}
    restart: on-failure

  # ─── USER SERVICE ─────────────────────────────────────────────────────────────
  # Rebuild: docker compose build user-service
  # Restart: docker compose up -d --build --no-deps user-service

  user-service:
    build:
      context: ./user-service     # ← builds ONLY from user-service/
      dockerfile: Dockerfile
    image: carmarket/user-service:local
    container_name: user-service
    networks: [carmarket-net]
    ports: ["8082:8082"]
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres-user:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      EUREKA_HOST: eureka-server
      EUREKA_USER: ${EUREKA_USER:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-admin}
      DB_HOST: postgres-user
      DB_NAME: user_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    restart: on-failure

  # ─── CAR SERVICE ──────────────────────────────────────────────────────────────
  # Rebuild: docker compose build car-service
  # Restart: docker compose up -d --build --no-deps car-service

  car-service:
    build:
      context: ./car-service      # ← builds ONLY from car-service/
      dockerfile: Dockerfile
    image: carmarket/car-service:local
    container_name: car-service
    networks: [carmarket-net]
    ports: ["8083:8083"]
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres-car:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      EUREKA_HOST: eureka-server
      EUREKA_USER: ${EUREKA_USER:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-admin}
      DB_HOST: postgres-car
      DB_NAME: car_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    restart: on-failure

  # ─── SEARCH SERVICE ────────────────────────────────────────────────────────────
  # Rebuild: docker compose build search-service
  # Restart: docker compose up -d --build --no-deps search-service

  search-service:
    build:
      context: ./search-service   # ← builds ONLY from search-service/
      dockerfile: Dockerfile
    image: carmarket/search-service:local
    container_name: search-service
    networks: [carmarket-net]
    ports: ["8084:8084"]
    depends_on:
      eureka-server:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      EUREKA_HOST: eureka-server
      EUREKA_USER: ${EUREKA_USER:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-admin}
      ES_HOST: elasticsearch
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    restart: on-failure

  # ─── CHAT DATABASE ──────────────────────────────────────────────────────────
  postgres-chat:
    image: postgres:16-alpine
    container_name: postgres-chat
    networks: [carmarket-net]
    ports: ["5436:5432"]
    environment:
      POSTGRES_DB: chat_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-chat-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chat_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── CHAT SERVICE ───────────────────────────────────────────────────────────
  # Rebuild: docker compose build chat-service
  # Restart: docker compose up -d --build --no-deps chat-service
  chat-service:
    build:
      context: ./chat-service
      dockerfile: Dockerfile
    image: carmarket/chat-service:local
    container_name: chat-service
    networks: [carmarket-net]
    ports: ["8085:8085"]
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres-chat:
        condition: service_healthy
    environment:
      EUREKA_HOST: eureka-server
      EUREKA_USER: ${EUREKA_USER:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-admin}
      CHAT_DB_HOST: postgres-chat
      CHAT_DB_PORT: 5432
      CHAT_DB_NAME: chat_db
      CHAT_DB_USER: postgres
      CHAT_DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-bXlTdXBlclNlY3JldEtleUZvckNhck1hcmtldEp3dFRva2VuMjAyNA==}
    restart: on-failure

  # ─── AUCTION DATABASE ───────────────────────────────────────────────────────
  postgres-auction:
    image: postgres:16-alpine
    container_name: postgres-auction
    networks: [ carmarket-net ]
    ports: [ "5437:5432" ]
    environment:
      POSTGRES_DB: carmarket_auctions
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-auction-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d carmarket_auctions" ]
      interval: 10s
      timeout: 5s
      retries: 5

   # ─── AUCTION IMPORT SERVICE ─────────────────────────────────────────────────
  auction-import-service:
    build:
      context: ./auction-import-service
      dockerfile: Dockerfile
    image: carmarket/auction-import-service:local
    container_name: auction-import-service
    networks: [ carmarket-net ]
    ports: [ "8086:8086" ]
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres-auction:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      EUREKA_HOST: eureka-server
      EUREKA_USER: ${EUREKA_USER:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-admin}
      DB_HOST: postgres-auction
      DB_USER: postgres
      DB_PASS: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    restart: on-failure