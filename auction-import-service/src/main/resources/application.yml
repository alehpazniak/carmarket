# Shared secret for verifying the internal identity header (X-Gateway-Signature)
# Must match the value used by api-gateway / car-service / user-service
gateway:
  internal-secret: ${GATEWAY_INTERNAL_SECRET:bXlTdXBlclNlY3JldEtleUZvckNhck1hcmtldEp3dFRva2VuMjAyNA==}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:admin}:${EUREKA_PASSWORD:admin}@${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

apibara:
  base-url: https://apibara.tech
  api-key: ${APIBARA_API_KEY:}      # from .env / env var, NEVER commit
  per-page: 50
  targets: []
    # добавляй новые модели здесь — код не трогаешь:
    # - make: Toyota
    #   model: RAV4
    #   year-from: 2019
    #   year-to: 2022

parser:
  sync:
    interval: 3600000   # 1 hour — free tier = 100 req/month, so DON'T poll every 5 min

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
