server:
  port: 8083

spring:
  application:
    name: auction-import-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:car_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

import:
  rates:
    ocean-freight-usd: 1200
    eu-port-fee-usd: 300
    customs-clearance-pln: 1500
    eu-delivery-pln: 800
    vat-rate: 0.23

#parser:
#  headless: true
#  proxy:
#    enabled: false
#    server: ""
#    list: []
#  sync:
#    interval: 300000  # 5 minutes

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:admin}:${EUREKA_PASSWORD:admin}@${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

apibara:
  base-url: https://apibara.tech
  api-key: ${APIBARA_API_KEY:}      # from .env / env var, NEVER commit
  per-page: 50
  targets:
    - make: Mazda
      model: CX-5
      year-from: 2018
      year-to: 2021
    # добавляй новые модели здесь — код не трогаешь:
    # - make: Toyota
    #   model: RAV4
    #   year-from: 2019
    #   year-to: 2022

parser:
  sync:
    interval: 3600000   # 1 hour — free tier = 100 req/month, so DON'T poll every 5 min

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
