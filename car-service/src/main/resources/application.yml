server:
  port: 8083

spring:
  application:
    name: car-service
  main:
    web-application-type: servlet
  mvc:
    pathmatch:
      use-suffix-pattern: false
  web:
    resources:
      add-mappings: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
    cache:
      type: redis
      redis:
        time-to-live: 300000  # 5 minut w milisekundach

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:car_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  # Databases created before Flyway was added (by ddl-auto) have no history table: they are
  # baselined at V6, so only V7+ runs there. A fresh database runs V1..Vn.
  # Own history table: auction-import-service run from the IDE defaults to car_db too, and its
  # flyway_schema_history (auction V1..V3) would otherwise fail car-service's validation.
  flyway:
    enabled: true
    table: flyway_schema_history_car
    baseline-on-migrate: true
    baseline-version: 6

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
      acks: all
      retries: 3
    # payment.completed / payment.refunded from payment-service (ListingPromotionService).
    # Producers send no type headers, so every message is read as PaymentEvent;
    # ErrorHandlingDeserializer skips a malformed message instead of retrying it forever.
    consumer:
      group-id: car-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.carmarket.*"
        spring.json.value.default.type: com.carmarket.car.dto.PaymentEvent
        spring.json.use.type.headers: false

promotion:
  expiry:
    fixed-delay-ms: 600000   # how often expired promotions are cleared (10 min)

gateway:
  internal-secret: ${GATEWAY_INTERNAL_SECRET:bXlTdXBlclNlY3JldEtleUZvckNhck1hcmtldEp3dFRva2VuMjAyNA==}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:admin}:${EUREKA_PASSWORD:admin}@${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true
#    hostname: 127.0.0.1
#    ip-address: 127.0.0.1
    lease-renewal-interval-in-seconds: 10

