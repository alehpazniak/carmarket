server:
  port: 8080

spring:
  application:
    name: api-gateway

  # Redis — used for rate limiting
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  cloud:
    gateway:
      # Disable default filters if you want full control
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      redis-rate-limiter:
        include-headers: true   # Show X-RateLimit-* (default: true)

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:admin}:${EUREKA_PASSWORD}@${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

jwt:
  secret: ${JWT_SECRET}

# Shared secret for signing the internal identity header (X-Gateway-Signature)
# Must match the value used by car-service / user-service
gateway:
  internal-secret: ${GATEWAY_INTERNAL_SECRET}
  # Reverse proxies in front of the gateway: 0 = use the direct remote address and ignore
  # X-Forwarded-For (local runs); N = take the N-th X-Forwarded-For entry from the right.
  trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:0}
  # Anonymous Apibara live lookups (quick check on /aukcje, vehicle preview): they spend the account's monthly
  # quota, so per IP and for all anonymous users together. Logged-in users keep the standard limiter.
  # Defaults are the free package's values (100 requests a month); raise them after buying a bigger package.
  apibara-anonymous:
    per-ip-per-second: ${APIBARA_ANON_PER_IP_PER_SECOND:1}
    # The vehicle page sends 3 lookups at once
    per-ip-burst: ${APIBARA_ANON_PER_IP_BURST:5}
    # Rolling 30-day budget shared by all anonymous users (not a calendar month); half of the free 100
    global-per-month: ${APIBARA_ANON_GLOBAL_PER_MONTH:50}

# Resilience4j circuit breaker defaults
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    configs:
      default:
        timeout-duration: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.carmarket.gateway: DEBUG