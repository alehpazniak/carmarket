server:
  port: 8090

spring:
  application:
    name: admin-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5441}/${DB_NAME:admin_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: admin-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.carmarket.*"
        spring.json.value.default.type: com.carmarket.admin.audit.AdminAuditEvent
        spring.json.use.type.headers: false

admin:
  system:
    # Per-instance /actuator/health call
    health-timeout: 2s
    # Reported DOWN when Eureka has no instance of them
    expected-services: >-
      api-gateway,auth-service,user-service,car-service,search-service,chat-service,
      notification-service,auction-import-service,payment-service,import-order-service,admin-service

gateway:
  internal-secret: ${GATEWAY_INTERNAL_SECRET}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:admin}:${EUREKA_PASSWORD}@${EUREKA_HOST:localhost}:8761/eureka/
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
